name: local_event_explorer
description: AI-powered local event discovery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────
  go_router: ^13.2.0

  # ── Firebase ──────────────────────────────────────
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19
  firebase_storage: ^11.6.10

  # ── Google Sign In ────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Maps ──────────────────────────────────────────
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # ── Networking ────────────────────────────────────
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # ── Local Storage ─────────────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # ── Media ─────────────────────────────────────────
  cached_network_image: ^3.3.1
  video_player: ^2.8.3
  chewie: ^1.7.5

  # ── Notifications ─────────────────────────────────
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # ── UI Utilities ──────────────────────────────────
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  gap: ^3.0.1

  # ── Permissions ───────────────────────────────────
  permission_handler: ^11.3.1

  # ── Utilities ─────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
